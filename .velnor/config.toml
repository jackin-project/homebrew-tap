schema = 2

[workflow]
name = "CI"
policy = "consumer-v1"
default_branch = "main"
generator_validation = "bootstrap"
max_parallel_jobs = 2
pull_request_cache_policy = "read-only"
runner_label = "ubuntu-26.04"

[workflow.review_completion]
provider = "codex-v1"
check_name = "Review completion"
app_id_variable = "REVIEW_COMPLETION_APP_ID"
app_private_key_secret = "REVIEW_COMPLETION_APP_PRIVATE_KEY"
reviewer_app_id_variable = "REVIEWER_APP_ID"

[resources]
compiler_process_budget = 2
test_process_budget = 2

[test_sharding]
default_shards = 1

[test_sharding.by_manifest]

[stacks]
ignore = []

[discovery]
exclude = []

[actions.overrides]

[execution]
default_profile = "hosted"
hosted_profile = "hosted"
scale_set_profile = "local"

[execution.profiles.hosted]
kind = "github-hosted"
label = "ubuntu-26.04"
platform = "linux/amd64"

[execution.profiles.local]
kind = "github-scale-set"
name = "ubuntu-26.04-scale-set"
labels = ["velnor", "ubuntu-26.04-scale-set"]
platform = "linux/amd64"

[[checks]]
id = "homebrew-preview-install"
task = "homebrew-preview-install-test"
directory = "."
inputs = [".velnor/config.toml", "Formula/jackin-preview.rb", "mise.lock", "mise.toml", "scripts/homebrew_install_policy.py", "scripts/test-homebrew-install.sh", "scripts/test_homebrew_install_policy.py"]
tools = ["python"]
timeout_minutes = 5

[checks.runner]
label = "macos-26"
platform = "macos_arm64"
executor = "hosted"

[[checks]]
id = "homebrew-preview-update"
task = "package-update"
directory = "."
inputs = [".velnor/config.toml", "Formula/jackin-preview.rb", "mise.lock", "mise.toml", "scripts/homebrew_install_policy.py", "scripts/package-update.py", "scripts/package-update.sh", "scripts/test-homebrew-install.sh", "scripts/test-package-update.sh", "scripts/test_homebrew_install_policy.py", "scripts/test_package_update.py"]
tools = ["python"]
timeout_minutes = 5

[checks.runner]
label = "ubuntu-26.04"
platform = "linux_x64"
executor = "hosted"

