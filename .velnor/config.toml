schema = 1

[workflow]
name = "CI"
policy = "consumer-v1"
default_branch = "main"
generator_validation = "bootstrap"
max_parallel_jobs = 2

[workflow.review_completion]
provider = "codex-v1"
check_name = "Review completion"
app_id_variable = "REVIEW_COMPLETION_APP_ID"
app_private_key_secret = "REVIEW_COMPLETION_APP_PRIVATE_KEY"
reviewer_app_id_variable = "REVIEWER_APP_ID"

[resources]
compiler_process_budget = 2
test_process_budget = 2

[test_sharding]
default_shards = 1

[stacks]
ignore = []

[discovery]
exclude = []

[[native_checks]]
id = "tap_tree"
operation = "tap_tree"
timeout_minutes = 5

[native_checks.runner]
label = "ubuntu-26.04"
platform = "linux_x64"
executor = "hosted"

[[native_checks]]
id = "adoption_contract"
operation = "adoption_contract"
timeout_minutes = 5

[native_checks.runner]
label = "ubuntu-26.04"
platform = "linux_x64"
executor = "hosted"
