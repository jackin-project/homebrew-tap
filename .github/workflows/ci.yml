      VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.38/velnor-actions-0.1.38-x86_64-unknown-linux-gnu
      VELNOR_RELEASE_COMMIT: f14043d24601a3d1787997376b7f0adcde61f139
      VELNOR_RUN_KEY_ATTEMPT: ${{ needs.plan.outputs.plan_attempt || github.run_attempt }}
    permissions:
