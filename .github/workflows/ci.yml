\t]*#.*$/, \"\")\n  if ($0 ~ /^[ \\t]*$/) { next }\n  line = $0\n  sub(/^[ \\t]+/, \"\", line)\n  k = line\n  sub(/[ \\t].*$/, \"\", k)\n  v = line\n  if (v == k) { v = \"\" } else { sub(/^[^ \\t]+[ \\t]+/, \"\", v); sub(/[ \\t]+$/, \"\", v) }\n  print file, k, v\n}' \"$1\" >> \"$velnor_db\"\n}\nvelnor_toolchain() {\n  if grep -q '^[[:space:]]*\\[' \"$1\"; then\n    velnor_toml \"$1\"\n    if velnor_mise config get -f \"$velnor_dir/src.toml\" toolchain.channel > \"$velnor_dir/channel\" 2>/dev/null; then\n      awk -v file=\"$1\" 'BEGIN { OFS = \"\\t\" } NR == 1 { v = $0; next } { v = v \" \" $0 } END { print file, \"rust\", v }' \"$velnor_dir/channel\" >> \"$velnor_db\"\n    fi\n  else\n    printf '%s\\t%s\\t%s\\n' \"$1\" rust \"$(tr -d ' \\t\\r\\n' < \"$1\")\" >> \"$velnor_db\"\n  fi\n}\nvelnor_exact() {\n  case \"$2\" in\n    ''|*[!0-9.]*|.*|*.|*..*|*.*.*.*|0[0-9]*|*.0[0-9]*) velnor_fail \"$1 must declare one exact X.Y.Z version, not '$(velnor_safe \"$2\")'\" ;;\n    *.*.*) ;;\n    *) velnor_fail \"$1 must declare one exact X.Y.Z version, not '$(velnor_safe \"$2\")'\" ;;\n  esac\n}\nvelnor_tool() {\n  name=$1\n  shift\n  resolved=\n  origin=\n  while IFS=\"$velnor_tab\" read -r file key value; do\n    matched=0\n    for want in \"$@\"; do\n      if [ \"$key\" = \"$want\" ]; then matched=1; fi\n    done\n    if [ \"$matched\" = 0 ]; then continue; fi\n    velnor_exact \"$file $key\" \"$value\"\n    if [ -n \"$resolved\" ] && [ \"$resolved\" != \"$value\" ]; then\n      velnor_fail \"$name: $file $key declares $value, $origin declares $resolved\"\n    fi\n    if [ -z \"$resolved\" ]; then origin=\"$file $key\"; fi\n    resolved=$value\n  done < \"$velnor_db\"\n  [ -n \"$resolved\" ] || velnor_fail \"$name: the project config no longer declares this tool; regenerate the workflow\"\n  printf '%s=%s\\n' \"$name\" \"$resolved\" >> \"$GITHUB_ENV\"\n  if [ \"$name\" = VELNOR_TOOL_RUST ] && [ \"${velnor_export_rustup-0}\" = 1 ]; then\n    printf 'RUSTUP_TOOLCHAIN=%s\\n' \"$resolved\" >> \"$GITHUB_ENV\"\n  fi\n  printf 'velnor: %s=%s\\n' \"$name\" \"$resolved\"\n}\nfor velnor_file in mise.toml .mise.toml mise.*.toml .mise.*.toml .config/mise.toml .config/mise.*.toml .config/mise/config.toml .config/mise/config.*.toml .config/mise/conf.d/*.toml mise/config.toml mise/config.*.toml .mise/config.toml .mise/config.*.toml; do\n  if [ ! -e \"$velnor_file\" ] && [ ! -L \"$velnor_file\" ]; then continue; fi\n  velnor_regular \"$velnor_file\"\n  velnor_tools \"$velnor_file\"\ndone\nif [ -e .tool-versions ] || [ -L .tool-versions ]; then\n  velnor_regular .tool-versions\n  velnor_tool_versions .tool-versions\nfi\nvelnor_tool VELNOR_TOOL_ACTIONLINT 'actionlint' 'aqua:rhysd/actionlint'\nvelnor_tool VELNOR_TOOL_SHELLCHECK 'shellcheck' 'aqua:koalaman/shellcheck'\nvelnor_tool VELNOR_TOOL_ZIZMOR 'zizmor' 'aqua:zizmorcore/zizmor' 'cargo:zizmor'\nrm -rf \"$velnor_dir\"\n" # zizmor: ignore[github-env]
      - name: Prepare pinned tools
        run: "mise --no-config --no-env --no-hooks install 'actionlint@'\"${VELNOR_TOOL_ACTIONLINT}\" 'shellcheck@'\"${VELNOR_TOOL_SHELLCHECK}\" 'zizmor@'\"${VELNOR_TOOL_ZIZMOR}\""
      - name: Acquire Velnor
        timeout-minutes: 6
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.28\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|sha256sum -c -;then cp \"$s\" \"$d\";else curl -fsSL --connect-timeout 15 --max-time 120 --retry 5 --retry-all-errors --retry-max-time 180 --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|sha256sum -c -;fi&&chmod +x \"$d\"'"
      - name: Write request
        env:
          VELNOR_INTERNAL_OP: write-request-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/plan-v1-request.json
          VELNOR_NAMED_CHECK_LANES_JSON: "{\"check-homebrew-preview-install\":[{\"job_id\":\"check-homebrew-preview-install\"}],\"check-homebrew-preview-update\":[{\"job_id\":\"check-homebrew-preview-update\"}]}"
        run: "\"$RUNNER_TEMP\"'/velnor/bin/velnor-actions-0.1.28'"
      - name: Check generated files
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; $RUNNER_TEMP/velnor/bin/velnor-actions-0.1.28 generate --output-dir \"$RUNNER_TEMP/velnor-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\" && diff -r --brief .github \"$RUNNER_TEMP/velnor-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/.github\"'"
      - name: Plan
        id: plan
        env:
          VELNOR_INTERNAL_OP: plan-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/plan-v1-request.json
        run: "\"$RUNNER_TEMP\"'/velnor/bin/velnor-actions-0.1.28'"
      - name: Publish plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: velnor-plan-r${{ github.run_id }}-a${{ env.VELNOR_RUN_KEY_ATTEMPT }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ env.VELNOR_RUN_KEY_ATTEMPT }}
          retention-days: "30"
      - name: Save Mise tools
        if: success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected == true && steps.v2.outputs.enabled == 'true' && steps.tools-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: mise-tools-v2-${{steps.v2.outputs.identity}}
          path: "~/.local/share/mise\n${{ runner.temp }}/velnor/rustup\n${{ runner.temp }}/velnor/cargo/.crates.toml\n${{ runner.temp }}/velnor/cargo/.crates2.json\n${{ runner.temp }}/velnor/cargo/bin"
  required:
    name: Required verdict
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CARGO_CACHE_AUTO_CLEAN_FREQUENCY: never
      RUSTUP_TOOLCHAIN: 1.99.1
      VELNOR_ASSET_SHA256: 3d12c51ccd6d6cfc8073e802dc8020a88281b0a4ebe0f8511441a32db4b94fd5
      VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.28/velnor-actions-0.1.28-x86_64-unknown-linux-gnu
      VELNOR_RELEASE_COMMIT: d30b50c493ba589ce15dfec55928fbb37cd4f2a2
      VELNOR_RUN_KEY_ATTEMPT: ${{ needs.plan.outputs.plan_attempt || github.run_attempt }}
    permissions:
      contents: read
      actions: read
    needs:
      - plan
      - check-homebrew-preview-install
      - check-homebrew-preview-update
      - actionlint
    if: ${{ !cancelled() }}
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: 50be7185bcf75929f01cc5630276bcb43ca367f7c5b176e2580903d28c611dc4
          version: 2026.10.14
      - name: Acquire Velnor
        timeout-minutes: 6
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.28\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|sha256sum -c -;then cp \"$s\" \"$d\";else curl -fsSL --connect-timeout 15 --max-time 120 --retry 5 --retry-all-errors --retry-max-time 180 --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|sha256sum -c -;fi&&chmod +x \"$d\"'"
      - name: Prepare pinned tools
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: mise --no-config --no-env --no-hooks install gh@2.102.0
      - name: Download plan
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: velnor-plan-r${{ github.run_id }}-a${{ env.VELNOR_RUN_KEY_ATTEMPT }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ env.VELNOR_RUN_KEY_ATTEMPT }}
      - name: Download every expected matrix artifact
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VELNOR_INTERNAL_OP: fetch-reports-v1
        run: "\"$RUNNER_TEMP\"'/velnor/bin/velnor-actions-0.1.28'"
      - name: Write request
        env:
          VELNOR_INTERNAL_OP: write-request-v1
          VELNOR_NEEDS_JSON: ${{ toJSON(needs) }}
          VELNOR_NEEDS_EXPECTED: "[\"actionlint\",\"check-homebrew-preview-install\",\"check-homebrew-preview-update\",\"plan\"]"
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/merge-v1-request.json
        run: "\"$RUNNER_TEMP\"'/velnor/bin/velnor-actions-0.1.28'"
      - name: Merge reports
        env:
          VELNOR_INTERNAL_OP: merge-v1
          VELNOR_NEEDS_JSON: ${{ toJSON(needs) }}
          VELNOR_NEEDS_EXPECTED: "[\"actionlint\",\"check-homebrew-preview-install\",\"check-homebrew-preview-update\",\"plan\"]"
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/merge-v1-request.json
        run: "\"$RUNNER_TEMP\"'/velnor/bin/velnor-actions-0.1.28'"
      - name: Publish final report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: velnor-final-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ env.VELNOR_RUN_KEY_ATTEMPT }}/final-report.json
          retention-days: "30"
  required-gate:
    name: Required
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      VELNOR_RUN_KEY_ATTEMPT: ${{ github.run_attempt }}
    needs:
      - required
    if: ${{ always() }}
    steps:
      - name: Fail unless the verdict passed
        if: ${{ always() && needs.required.result != 'success' }}
        run: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR false
