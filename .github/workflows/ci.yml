          path: "~/.local/share/mise\n${{ runner.temp }}/velnor/rustup\n${{ runner.temp }}/velnor/cargo/.crates.toml\n${{ runner.temp }}/velnor/cargo/.crates2.json\n${{ runner.temp }}/velnor/cargo/bin"
      - name: Report optional cache save failure
        if: always() && !cancelled() && steps.velnor-optional-tools-save.outcome == 'failure'
        run: "printf '%s\\n' '::warning::cache_unavailable: optional save failed or timed out'"
  required:
    name: Required verdict
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      CARGO_CACHE_AUTO_CLEAN_FREQUENCY: never
      RUSTUP_TOOLCHAIN: 1.99.1
