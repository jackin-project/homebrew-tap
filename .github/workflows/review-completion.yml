# Generated by Velnor Actions 0.1.29; edit .velnor/config.toml and regenerate.
name: Native review completion
"on":
  issue_comment:
    types:
      - created # zizmor: ignore[dangerous-triggers] -- closed source-free provider adapter
      - edited
      - deleted
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
permissions: {}
concurrency:
  group: review-completion-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  review-completion:
    name: Authenticate review completion
    if: ${{ github.event_name == 'pull_request_target' || github.event.issue.pull_request }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: review-completion
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Install pinned Mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: 2026.10.15
          sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          install: "false"
      - name: Install pinned GitHub CLI
        shell: bash
        run: mise --no-config --no-env --no-hooks install gh@2.102.0
      - name: Acquire Velnor
        timeout-minutes: 6
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          CARGO_REGISTRY_TOKEN: ""
          GH_CONFIG_DIR: ""
          GH_HOST: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          VELNOR_ASSET_SHA256: ffb8c82a10ae55344225cb77f8a3f68c2ccd42068cff5959254bfed5d7780b74
          VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.29/velnor-actions-0.1.29-x86_64-unknown-linux-gnu
          VELNOR_RELEASE_COMMIT: e7b2f088715379c22be473fab896a43d50cc16fc
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.29\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|sha256sum -c -;then cp \"$s\" \"$d\";else curl -fsSL --connect-timeout 15 --max-time 120 --retry 5 --retry-all-errors --retry-max-time 180 --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|sha256sum -c -;fi&&chmod +x \"$d\"'"
      - name: Capture authenticated provider and feedback
        id: capture
        shell: bash
        run: "set -euo pipefail\numask 077\nmkdir -p \"$RUNNER_TEMP/velnor\"\n(set -C; printf '%s' \"$VELNOR_REVIEW_COMPLETION_POLICY\" > \"$VELNOR_REQUEST_FILE\")\n\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.29\"\n"
        env:
          VELNOR_INTERNAL_OP: capture-review-completion-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/review-completion-policy.json
          VELNOR_COMPLETION_APP_ID: ${{ vars.REVIEW_COMPLETION_APP_ID }}
          VELNOR_REVIEWER_APP_ID: ${{ vars.REVIEWER_APP_ID }}
          GH_TOKEN: ${{ github.token }}
          VELNOR_REVIEW_COMPLETION_POLICY: "{\"check_name\":\"Review completion\",\"default_branch\":\"main\",\"provider\":\"codex-v1\",\"repository\":\"jackin-project/homebrew-tap\",\"schema\":\"velnor.review-completion-policy.v1\"}"
      - name: Mint independent completion check capability
        id: completion-token
        if: ${{ steps.capture.outputs.eligible == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.REVIEW_COMPLETION_APP_ID }}
          private-key: ${{ secrets.REVIEW_COMPLETION_APP_PRIVATE_KEY }}
          owner: jackin-project
          repositories: homebrew-tap
          permission-checks: write
          permission-pull-requests: read
          permission-contents: read
          skip-token-revoke: false
      - name: Emit freshly authenticated review state
        id: emit
        shell: bash
        run: "set -euo pipefail\numask 077\n\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.29\"\n"
        env:
          VELNOR_INTERNAL_OP: emit-review-completion-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/review-completion-policy.json
          VELNOR_COMPLETION_APP_ID: ${{ vars.REVIEW_COMPLETION_APP_ID }}
          VELNOR_REVIEWER_APP_ID: ${{ vars.REVIEWER_APP_ID }}
          GH_TOKEN: ${{ steps.completion-token.outputs.token }}
          VELNOR_REVIEW_COMPLETION_PROPOSAL_DIGEST: ${{ steps.capture.outputs.proposal_digest }}
        if: ${{ steps.capture.outputs.eligible == 'true' }}
