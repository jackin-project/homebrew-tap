schema = 2
[generator]
repository = "jackin-project/homebrew-tap"
revision = "eed474c4a1d9b071fd1b5de00c769c8997398e5a"
[scan]
exclude = ["Formula/**", "Casks/**"]
[workflow]
providers = ["github-hosted"]
automatic_providers = ["github-hosted"]
default_branch = "main"
[workflow.selectors.github-hosted]
runs_on = ["ubuntu-24.04"]
[policy]
ruleset_required_status_checks = ["ci-required", "Policy"]
ruleset_external_status_checks = ["DCO"]
[[units]]
id = "homebrew"
kind = "homebrew"
root = "."
watch = ["Formula/**", "Casks/**", "Brewfile", "mise.toml", "mise.lock", "scripts/**"]
ci_tasks = ["check"]
mise_tools = ["actionlint", "jq", "python", "uv", "pipx:reuse", "shellcheck"]
