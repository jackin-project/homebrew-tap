schema = 1
[generator]
repository = "jackin-project/homebrew-tap"
revision = "92a2b13b4d0fe9e4862c0145999d9ca2ae6450b4"
[scan]
exclude = ["Formula/**", "Casks/**"]
[workflow]
runners = "github"
automatic = "github"
default_dispatch_runner = "github"
automatic_lanes = "github"
github_runner = "ubuntu-24.04"
velnor_labels = ["self-hosted", "velnor-target-mvp"]
default_branch = "main"
[policy]
ruleset_external_status_checks = ["DCO"]
[[units]]
id = "homebrew"
kind = "homebrew"
root = "."
watch = ["Formula/**", "Casks/**", "Brewfile", "mise.toml", "mise.lock", "scripts/**"]
ci_tasks = ["check"]
mise_tools = ["actionlint", "jq", "python", "uv", "pipx:reuse"]
